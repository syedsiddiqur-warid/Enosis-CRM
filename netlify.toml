# Netlify: builds the Next.js app and applies database migrations first. Environment variables are set
# in the Netlify UI; see docs/DEPLOY-NETLIFY.md.
[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime turns the server parts (pages, API routes, server actions) into Netlify Functions.
# Named here so it always runs; without it only static files are uploaded and every page is "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"
